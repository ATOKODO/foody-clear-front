# Overlay for the existing Compose stack that has a service named "front".
services:
  mobile-https:
    image: caddy:2-alpine
    ports:
      - "443:443"
    environment:
      FOODY_HOST: ${FOODY_HOST:-foody.home.arpa}
    volumes:
      - ${FOODY_MOBILE_CADDYFILE:?Set FOODY_MOBILE_CADDYFILE to the absolute path of deploy/mobile/Caddyfile}:/etc/caddy/Caddyfile:ro
      - foody_caddy_data:/data
      - foody_caddy_config:/config
    depends_on:
      - front

volumes:
  foody_caddy_data:
  foody_caddy_config:
