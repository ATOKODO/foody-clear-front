name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: sudo apt-get install -y fonts-noto-core fonts-dejavu-core fonts-liberation
      - run: npm run typecheck:e2e
      - run: npm run e2e:vrt
      - name: Upload visual report and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/visual/
            test-results/visual/
          retention-days: 14
