<section class="mx-auto w-full max-w-[1700px] px-3 py-6 sm:px-4 lg:px-5 xl:px-6" data-testid="template-page">
  <app-template-list
    [templates]="templates"
    [selectedTemplateId]="selectedTemplateId"
    [selectedTemplate]="selectedTemplate"
    [compareDaySetId]="compareDaySetId"
    [daySets]="daySetOptions"
    [slots]="slotOptions"
    [loadingTemplates]="loadingTemplates"
    [loadingProducts]="loadingProducts"
    [loadingDaySets]="loadingDaySets"
    [loadingSlots]="loadingSlots"
    [savingTemplate]="savingTemplate"
    [savingItem]="savingItem"
    [lastError]="lastError"
    (addRequested)="startCreateTemplate()"
    (editRequested)="openSelectedTemplateEditor()"
    (templateSelected)="selectTemplate($event)"
    (compareDaySetChanged)="onCompareDaySetChange($event)"
  >
  </app-template-list>
</section>

<ng-template #templateEditorDialog>
  <div class="template-form-dialog" data-testid="template-dialog">
    <div class="template-form-dialog__header">
      <div>
        <p class="template-form-dialog__eyebrow">Template</p>
        <h3 class="template-form-dialog__title">{{ formDialogTitle }}</h3>
        <p class="template-form-dialog__subtitle">{{ formDialogSubtitle }}</p>
      </div>

      <button
        mat-stroked-button
        type="button"
        (click)="closeEditorDialog()"
        [disabled]="savingTemplate || savingItem"
      >
        Fermer
      </button>
    </div>

    <mat-dialog-content class="template-form-dialog__content space-y-6">
      <app-template-form
        [mode]="formMode"
        [template]="editedTemplate"
        [products]="productOptions"
        [slots]="slotOptions"
        [qtyUnitOptions]="qtyUnitOptions"
        [savingTemplate]="savingTemplate"
        [savingItem]="savingItem"
        [itemError]="itemError"
        (templateSubmitted)="onTemplateSubmitted($event)"
        (templateDeleted)="onTemplateDeleted($event)"
        (itemSubmitted)="onItemSubmitted($event)"
        (itemDeleted)="onItemDeleted($event)"
      >
      </app-template-form>
    </mat-dialog-content>
  </div>
</ng-template>
