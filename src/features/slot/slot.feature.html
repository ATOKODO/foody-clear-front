<section class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <mat-card class="overflow-hidden rounded-2xl">
    <div class="bg-slate-900 px-6 py-5 text-white">
      <h2 class="text-xl font-semibold">Slots</h2>
      <p class="mt-1 text-sm text-slate-300">
        Ajout et visualisation des slots.
      </p>
    </div>

    <div class="space-y-6 p-4 sm:p-6">
      <app-slot-list
        mode="manage"
        [slots]="slots"
        (addRequested)="onAddRequested()">
      </app-slot-list>

      <mat-card *ngIf="formVisible" appearance="outlined" class="rounded-xl">
        <mat-card-content class="p-0">
          <app-slot-form
            [mode]="formMode"
            [slot]="formInitialValue"
            (submitted)="onFormSubmitted($event)"
            (menuClicked)="onMenuClicked()">
          </app-slot-form>
        </mat-card-content>

        <mat-card-actions class="flex justify-center pb-6">
          <button mat-stroked-button type="button" (click)="onCancelForm()">
            Annuler
          </button>
        </mat-card-actions>
      </mat-card>

      <div *ngIf="lastResponse" class="space-y-2">
        <h3 class="text-sm font-semibold text-slate-800">Derniere reponse</h3>
        <pre class="max-h-72 overflow-auto rounded-lg bg-slate-100 p-3 text-xs text-slate-800">{{ lastResponse | json }}</pre>
      </div>
    </div>
  </mat-card>
</section>
