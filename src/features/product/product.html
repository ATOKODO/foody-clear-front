<section class="app-page catalogue-page" data-testid="product-page">
  <div class="catalogue-page__toggle-wrap">
    <app-segmented-toggle
      [value]="activeView"
      [options]="viewOptions"
      (valueChange)="onActiveViewChange($event)"
      ariaLabel="Selection de la vue catalogue active"
      data-testid="catalogue-view-toggle"
      name="catalogue-view"
    ></app-segmented-toggle>
  </div>

  <mat-card class="catalogue-panel" data-testid="catalogue-panel">
    <div class="catalogue-panel__header">
      <h2 class="catalogue-panel__title" data-testid="catalogue-panel-title">
        {{ activeViewConfig.title }}
      </h2>

      <div class="catalogue-panel__actions">
        <button
          mat-stroked-button
          type="button"
          class="catalogue-action catalogue-action--secondary"
          (click)="onRefreshActiveView()"
          [disabled]="activeViewBusy"
        >
          Rafraichir
        </button>

        <button
          mat-stroked-button
          type="button"
          class="catalogue-action catalogue-action--primary"
          (click)="onAddActiveView()"
          [disabled]="activeViewBusy"
          data-testid="catalogue-add-action"
        >
          {{ activeViewConfig.addLabel }}
        </button>
      </div>
    </div>

    <div class="catalogue-panel__content">
      <ng-container [ngSwitch]="activeView">
        <div *ngSwitchCase="'product'" class="catalogue-panel__section" data-testid="catalogue-product-view">
          <div class="app-status-row">
            <span
              *ngIf="loading"
              class="app-status-pill app-status-pill--neutral"
            >
              Chargement...
            </span>
            <span
              *ngIf="saving"
              class="app-status-pill app-status-pill--saving"
            >
              Sauvegarde...
            </span>
            <span
              *ngIf="loadingMeta"
              class="app-status-pill app-status-pill--info"
            >
              Meta...
            </span>
          </div>

          <app-ui-error-panel *ngIf="lastError" [error]="lastError"></app-ui-error-panel>

          <p
            *ngIf="lastMetaError"
            class="app-alert"
          >
            Impossible de charger les metas (units / nutrition keys), fallback
            actif.
          </p>

          <app-product-list
            mode="manage"
            [products]="productListItems"
            [embedded]="true"
            (addRequested)="onAddRequested()"
            (editRequested)="onEditRequested($event)"
            (deleteRequested)="onDeleteRequested($event)"
          >
          </app-product-list>
        </div>

        <app-category
          *ngSwitchCase="'category'"
          [embedded]="true"
          (dataChanged)="onLinkedDataChanged()"
        ></app-category>

        <app-generic-product
          *ngSwitchCase="'genericProduct'"
          [embedded]="true"
          (dataChanged)="onLinkedDataChanged()"
        ></app-generic-product>

        <app-tag
          *ngSwitchCase="'tag'"
          [embedded]="true"
          (dataChanged)="onLinkedDataChanged()"
        ></app-tag>
      </ng-container>
    </div>
  </mat-card>
</section>

<ng-template #productFormDialog>
  <div class="product-form-dialog" data-testid="product-dialog">
    <div class="product-form-dialog__header">
      <div>
        <p class="product-form-dialog__eyebrow">Product</p>
        <h3 class="product-form-dialog__title">{{ formDialogTitle }}</h3>
        <p class="product-form-dialog__subtitle">{{ formDialogSubtitle }}</p>
      </div>

      <button mat-stroked-button type="button" (click)="onCancelForm()" [disabled]="saving">
        Fermer
      </button>
    </div>

    <mat-dialog-content class="product-form-dialog__content">
      <app-product-form
        [mode]="formMode"
        [product]="formInitialValue"
        [showHeading]="false"
        [categories]="categoryOptions"
        [genericProducts]="genericProductOptions"
        [tags]="tagOptions"
        [quantityUnits]="quantityUnitOptions"
        [nutritionKeys]="nutritionKeyOptions"
        (submitted)="onFormSubmitted($event)"
        (menuClicked)="onMenuClicked()">
      </app-product-form>
    </mat-dialog-content>
  </div>
</ng-template>
