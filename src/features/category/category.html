<section class="app-page" data-testid="category-page">
  <mat-card class="overflow-hidden rounded-2xl">
    <div class="flex items-center justify-between bg-slate-900 px-6 py-5 text-white">
      <div>
        <h2 class="text-xl font-semibold">Categories</h2>
        <p class="mt-1 text-sm text-slate-300">Structure, alertes et seuils par categorie.</p>
      </div>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="store.refresh()"
      >
        Rafraichir
      </button>
    </div>

    <div class="space-y-4 p-4 sm:p-6">
      <div class="app-status-row">
        <span
          *ngIf="store.loading()"
          class="app-status-pill app-status-pill--neutral"
        >
          Chargement...
        </span>
        <span
          *ngIf="store.saving()"
          class="app-status-pill app-status-pill--saving"
        >
          Sauvegarde...
        </span>
      </div>

      <app-ui-error-panel
        *ngIf="store.hasError()"
        [error]="store.lastError()"
      ></app-ui-error-panel>

      <app-category-list
        mode="manage"
        [categories]="store.categoryListItems()"
        (addRequested)="store.openCreateForm()"
        (editRequested)="store.openEditForm($event)"
        (deleteRequested)="store.deleteCategory($event)"
      >
      </app-category-list>
    </div>
  </mat-card>
</section>

<div
  class="app-modal-backdrop"
  *ngIf="store.formVisible()"
  (click)="store.cancelForm()"
></div>
<div class="app-modal-shell" *ngIf="store.formVisible()" data-testid="category-dialog">
  <mat-card
    appearance="outlined"
    class="app-modal-card"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="app-dialog-header">
      <div>
        <p class="app-dialog-eyebrow">Catalogue</p>
        <h3 class="app-dialog-title">{{ store.dialogTitle() }}</h3>
        <p class="app-dialog-subtitle">{{ store.dialogSubtitle() }}</p>
      </div>

      <button mat-stroked-button type="button" (click)="store.cancelForm()">
        Fermer
      </button>
    </div>

    <div class="app-dialog-content">
      <app-category-form
        [mode]="store.formMode()"
        [category]="store.formInitialValue()"
        [showHeading]="false"
        (submitted)="store.submitForm($event)"
      >
      </app-category-form>
    </div>
  </mat-card>
</div>
