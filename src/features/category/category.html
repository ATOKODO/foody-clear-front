<section class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <mat-card class="overflow-hidden rounded-2xl">
    <div class="flex items-center justify-between bg-slate-900 px-6 py-5 text-white">
      <div>
        <h2 class="text-xl font-semibold">Categories</h2>
        <p class="mt-1 text-sm text-slate-300">Gestion des categories.</p>
      </div>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onRefreshRequested()"
      >
        Rafraichir
      </button>
    </div>

    <div>


      <div class="flex flex-wrap items-center gap-2">
        <span
          *ngIf="loading"
          class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700"
        >
          Chargement...
        </span>
        <span
          *ngIf="saving"
          class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-700"
        >
          Sauvegarde...
        </span>
      </div>

      <p
        *ngIf="lastError"
        class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
      >
        {{ lastError | json }}
      </p>

      <app-category-list
        mode="manage"
        [categories]="categoryListItems"
        (addRequested)="onAddRequested()"
        (editRequested)="onEditRequested($event)"
        (deleteRequested)="onDeleteRequested($event)"
      >
      </app-category-list>

      <mat-card *ngIf="formVisible" appearance="outlined" class="rounded-xl">
        <mat-card-content class="p-0">
          <app-category-form
            [mode]="formMode"
            [category]="formInitialValue"
            (submitted)="onFormSubmitted($event)"
            (menuClicked)="onMenuClicked()"
          >
          </app-category-form>
        </mat-card-content>

        <mat-card-actions class="flex justify-center pb-6">
          <button mat-stroked-button type="button" (click)="onCancelForm()">
            Annuler
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </mat-card>
</section>
