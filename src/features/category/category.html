<section class="app-page" data-testid="category-page">
  <mat-card class="overflow-hidden rounded-2xl">
    <div class="flex items-center justify-between bg-slate-900 px-6 py-5 text-white">
      <div>
        <h2 class="text-xl font-semibold">Categories</h2>
        <p class="mt-1 text-sm text-slate-300">Structure, alertes et seuils par categorie.</p>
      </div>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onRefreshRequested()"
      >
        Rafraichir
      </button>
    </div>

    <div class="space-y-4 p-4 sm:p-6">
      <div class="app-status-row">
        <span
          *ngIf="loading"
          class="app-status-pill app-status-pill--neutral"
        >
          Chargement...
        </span>
        <span
          *ngIf="saving"
          class="app-status-pill app-status-pill--saving"
        >
          Sauvegarde...
        </span>
      </div>

      <app-ui-error-panel *ngIf="lastError" [error]="lastError"></app-ui-error-panel>

      <app-category-list
        mode="manage"
        [categories]="categoryListItems"
        (addRequested)="onAddRequested()"
        (editRequested)="onEditRequested($event)"
        (deleteRequested)="onDeleteRequested($event)"
      >
      </app-category-list>
    </div>
  </mat-card>
</section>

<div class="app-modal-backdrop" *ngIf="formVisible" (click)="onCancelForm()"></div>
<div class="app-modal-shell" *ngIf="formVisible" data-testid="category-dialog">
  <mat-card
    appearance="outlined"
    class="app-modal-card"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="app-dialog-header">
      <div>
        <p class="app-dialog-eyebrow">Catalogue</p>
        <h3 class="app-dialog-title">
          {{ formMode === 'edit' ? 'Modifier une categorie' : 'Ajouter une categorie' }}
        </h3>
        <p class="app-dialog-subtitle">
          Regle les alertes, la fraicheur recente et le seuil minimum pour cette categorie.
        </p>
      </div>

      <button mat-stroked-button type="button" (click)="onCancelForm()">
        Fermer
      </button>
    </div>

    <div class="app-dialog-content">
      <app-category-form
        [mode]="formMode"
        [category]="formInitialValue"
        [showHeading]="false"
        (submitted)="onFormSubmitted($event)"
        (menuClicked)="onMenuClicked()"
      >
      </app-category-form>
    </div>
  </mat-card>
</div>
