<section class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
  <mat-card class="overflow-hidden rounded-2xl">
    <div class="bg-slate-900 px-6 py-5 text-white">
      <h2 class="text-xl font-semibold">Nutrition Values API Tester</h2>
      <p class="mt-1 text-sm text-slate-300">
        Interface Material + Tailwind pour tester les endpoints nutrition-values.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="$event.preventDefault()" class="space-y-6 p-4 sm:p-6">
      <mat-card appearance="outlined" class="rounded-xl">
        <mat-card-content class="pt-4">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Base URL</mat-label>
            <input
              matInput
              type="text"
              [(ngModel)]="baseUrl"
              [ngModelOptions]="{ standalone: true }"
              placeholder="http://localhost:3000" />
          </mat-form-field>
        </mat-card-content>
      </mat-card>

      <mat-card appearance="outlined" class="rounded-xl">
        <mat-card-header>
          <mat-card-title>Nutrition Value</mat-card-title>
          <mat-card-subtitle>Champs principaux</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="pt-2">
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <mat-form-field appearance="fill" class="w-full">
              <mat-label>id (GET/PATCH/DELETE)</mat-label>
              <input matInput type="number" formControlName="id" />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
              <mat-label>productId (requis pour CREATE)</mat-label>
              <input matInput type="number" formControlName="productId" />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full sm:col-span-2 lg:col-span-1">
              <mat-label>label *</mat-label>
              <input matInput type="text" formControlName="label" />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
              <mat-label>amount *</mat-label>
              <input matInput type="number" formControlName="amount" />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
              <mat-label>unit *</mat-label>
              <input matInput type="text" formControlName="unit" />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
              <mat-label>per *</mat-label>
              <input matInput type="number" formControlName="per" />
            </mat-form-field>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-divider />

      <div class="flex flex-wrap gap-2">
        <button mat-stroked-button type="button" (click)="fillDemoCreate()">Exemple (remplir)</button>
        <button mat-raised-button color="primary" type="button" (click)="create()">Create (POST)</button>
        <button mat-raised-button color="primary" type="button" (click)="getOne()">Get (GET /:id)</button>
        <button mat-raised-button color="primary" type="button" (click)="getAll()">GetAll (GET)</button>
        <button mat-raised-button color="accent" type="button" (click)="update()">Update (PATCH)</button>
        <button mat-raised-button color="warn" type="button" (click)="delete()">Delete (DELETE)</button>
        <button mat-button type="button" (click)="clear()">Clear</button>
      </div>
    </form>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="space-y-3 p-4 sm:p-6">
      <p *ngIf="lastError" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ lastError | json }}
      </p>

      <h3 class="text-base font-semibold text-slate-900">Derniere reponse</h3>
      <pre class="max-h-96 overflow-auto rounded-lg bg-slate-100 p-4 text-xs text-slate-800">
{{ lastResponse | json }}
      </pre>
    </div>
  </mat-card>
</section>
