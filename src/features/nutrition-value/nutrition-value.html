<div style="max-width: 720px; margin: 24px auto; font-family: system-ui, Arial;">
  <h2>Tester API — Nutrition Values</h2>

  <!-- Base URL -->
  <div style="margin: 8px 0 16px;">
    <label>
      Base URL :
      <input
        type="text"
        [value]="baseUrl"
        (input)="baseUrl"
        style="width: 100%; padding: 8px; margin-top: 4px;"
        placeholder="http://localhost:3000"
      />
    </label>
  </div>

  <form [formGroup]="form" (ngSubmit)="$event.preventDefault()" style="display: grid; gap: 12px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label>id (GET/PATCH/DELETE)</label>
        <input type="number" formControlName="id" style="width: 100%; padding: 8px;" />
      </div>
      <div>
        <label>productId (requis pour CREATE)</label>
        <input type="number" formControlName="productId" style="width: 100%; padding: 8px;" />
      </div>
    </div>

    <div>
      <label>label *</label>
      <input type="text" formControlName="label" style="width: 100%; padding: 8px;" />
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
      <div>
        <label>amount *</label>
        <input type="number" formControlName="amount" style="width: 100%; padding: 8px;" />
      </div>
      <div>
        <label>unit *</label>
        <input type="text" formControlName="unit" style="width: 100%; padding: 8px;" />
      </div>
      <div>
        <label>per *</label>
        <input type="number" formControlName="per" style="width: 100%; padding: 8px;" />
      </div>
    </div>

    <!-- Actions -->
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
      <button type="button" (click)="fillDemoCreate()">Exemple (remplir)</button>
      <button type="button" (click)="create()">Create (POST)</button>
      <button type="button" (click)="getOne()">Get (GET /:id)</button>
      <button type="button" (click)="getAll()">GetAll (GET)</button>
      <button type="button" (click)="update()">Update (PATCH)</button>
      <button type="button" (click)="delete()">Delete (DELETE)</button>
      <button type="button" (click)="clear()">Clear</button>
    </div>
  </form>

  <!-- État -->
  <div style="margin-top: 16px;">
    <span *ngIf="loading">⏳ Loading...</span>
    <span *ngIf="lastError" style="color: #b00020;">💥 {{ lastError | json }}</span>
  </div>

  <!-- Résultat -->
  <h3 style="margin-top: 16px;">Dernière réponse</h3>
  <pre style="background:#f6f8fa; padding: 12px; border-radius: 8px; overflow:auto;">
{{ lastResponse | json }}
  </pre>
</div>
