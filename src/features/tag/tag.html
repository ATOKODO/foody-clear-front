<ng-container *ngIf="embedded; else standaloneTemplate">
  <div class="space-y-4" data-testid="tag-embedded">
    <div class="app-status-row">
      <span *ngIf="loading" class="app-status-pill app-status-pill--neutral">
        Chargement...
      </span>
      <span *ngIf="saving" class="app-status-pill app-status-pill--saving">
        Sauvegarde...
      </span>
    </div>

    <app-ui-error-panel *ngIf="lastError" [error]="lastError"></app-ui-error-panel>

    <app-tag-list
      mode="manage"
      [tags]="tagListItems"
      [embedded]="true"
      (addRequested)="onAddRequested()"
      (editRequested)="onEditRequested($event)"
      (deleteRequested)="onDeleteRequested($event)">
    </app-tag-list>
  </div>
</ng-container>

<ng-template #standaloneTemplate>
  <section class="app-page" data-testid="tag-page">
    <mat-card class="overflow-hidden rounded-2xl">
      <div class="flex items-center justify-between bg-slate-900 px-6 py-5 text-white">
        <div>
          <h2 class="text-xl font-semibold">Tags</h2>
          <p class="mt-1 text-sm text-slate-300">
            Taxonomie et etiquetage transverse du catalogue.
          </p>
        </div>
        <button mat-raised-button color="primary" type="button" (click)="onRefreshRequested()">
          Rafraichir
        </button>
      </div>

      <div class="space-y-4 p-4 sm:p-6">
        <div class="app-status-row">
          <span *ngIf="loading" class="app-status-pill app-status-pill--neutral">
            Chargement...
          </span>
          <span *ngIf="saving" class="app-status-pill app-status-pill--saving">
            Sauvegarde...
          </span>
        </div>

        <app-ui-error-panel *ngIf="lastError" [error]="lastError"></app-ui-error-panel>

        <app-tag-list
          mode="manage"
          [tags]="tagListItems"
          (addRequested)="onAddRequested()"
          (editRequested)="onEditRequested($event)"
          (deleteRequested)="onDeleteRequested($event)">
        </app-tag-list>
      </div>
    </mat-card>
  </section>
</ng-template>

<div class="app-modal-backdrop" *ngIf="formVisible" (click)="onCancelForm()"></div>
<div class="app-modal-shell" *ngIf="formVisible">
  <mat-card
    appearance="outlined"
    class="app-modal-card"
    data-testid="tag-dialog"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="app-dialog-header">
      <div>
        <p class="app-dialog-eyebrow">Catalogue</p>
        <h3 class="app-dialog-title">
          {{ formMode === 'edit' ? 'Modifier un tag' : 'Ajouter un tag' }}
        </h3>
        <p class="app-dialog-subtitle">
          Utilise des tags pour filtrer rapidement les produits et regrouper les usages.
        </p>
      </div>

      <button mat-stroked-button type="button" (click)="onCancelForm()">
        Fermer
      </button>
    </div>

    <div class="app-dialog-content">
      <app-tag-form
        [mode]="formMode"
        [tag]="formInitialValue"
        [showHeading]="false"
        (submitted)="onFormSubmitted($event)"
        (menuClicked)="onMenuClicked()">
      </app-tag-form>
    </div>
  </mat-card>
</div>
