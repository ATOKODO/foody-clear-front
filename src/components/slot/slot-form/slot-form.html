<section class="mx-auto max-w-4xl px-4 py-8 text-gray-900" aria-label="Ajouter ou modifier un slot">
  <div class="mb-6 flex items-center justify-between border-b border-slate-200 pb-3">
    <h2 class="text-xl font-medium">{{ heading }}</h2>
    <button mat-stroked-button type="button" (click)="onMenuClick()">Options</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="grid gap-4 md:grid-cols-12">
      <mat-form-field appearance="fill" class="ssf-field md:col-span-4">
        <mat-label>Key</mat-label>
        <input matInput type="text" formControlName="key" placeholder="morning" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="ssf-field md:col-span-6">
        <mat-label>Titre</mat-label>
        <input matInput type="text" formControlName="title" placeholder="Petit dejeuner" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="ssf-field md:col-span-2">
        <mat-label>Ordre</mat-label>
        <input matInput type="number" min="0" formControlName="sortOrder" />
      </mat-form-field>
    </div>

    <div class="space-y-3">
      <div class="flex items-center justify-between gap-3">
        <h3 class="text-base font-semibold text-slate-900">Nutrition values</h3>
        <button mat-stroked-button type="button" (click)="addNutritionValue()">
          Ajouter une valeur
        </button>
      </div>

      <p *ngIf="nutritionKeys.length === 0" class="text-sm text-slate-600">
        Les cles nutritionnelles meta ne sont pas chargees, saisie libre active.
      </p>

      <div *ngFor="let value of nutritionValues; let i = index" class="grid gap-3 md:grid-cols-12 md:items-start">
        <mat-form-field appearance="fill" class="ssf-field md:col-span-4">
          <mat-label>Cle</mat-label>
          <mat-select
            [(ngModel)]="value.nutritionKey"
            [ngModelOptions]="{ standalone: true }"
            (selectionChange)="onNutritionKeyChange(i)">
            <mat-option *ngFor="let item of nutritionKeys" [value]="item.value">
              {{ item.label }}
            </mat-option>
          </mat-select>
          <mat-hint *ngIf="nutritionKeys.length === 0">
            Aucune cle meta disponible
          </mat-hint>
        </mat-form-field>

        <mat-form-field appearance="fill" class="ssf-field md:col-span-2">
          <mat-label>Amount</mat-label>
          <input
            matInput
            type="number"
            min="0"
            [(ngModel)]="value.amount"
            [ngModelOptions]="{ standalone: true }" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="ssf-field md:col-span-2">
          <mat-label>Unite</mat-label>
          <mat-select
            [(ngModel)]="value.unit"
            [ngModelOptions]="{ standalone: true }">
            <mat-option *ngFor="let unit of getUnitsForKey(value.nutritionKey)" [value]="unit">
              {{ unit }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="ssf-field md:col-span-3">
          <mat-label>Reference</mat-label>
          <mat-select
            [(ngModel)]="value.reference"
            [ngModelOptions]="{ standalone: true }">
            <mat-option *ngFor="let reference of referenceOptions" [value]="reference.value">
              {{ reference.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="md:col-span-1 md:pt-2">
          <button mat-stroked-button color="warn" type="button" (click)="removeNutritionValue(i)">
            Retirer
          </button>
        </div>
      </div>
    </div>

    <div class="flex justify-center pt-2">
      <button mat-raised-button color="primary" type="submit" class="rounded-full px-8">
        Valider
      </button>
    </div>
  </form>
</section>
