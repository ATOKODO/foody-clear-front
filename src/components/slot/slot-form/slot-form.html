<section class="slot-form" aria-label="Ajouter ou modifier un slot">
  <div class="sf-head">
    <h2>{{ heading }}</h2>
    <button type="button" class="menu-btn" aria-label="Plus d'options" (click)="onMenuClick()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6" cy="12" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="18" cy="12" r="2" />
      </svg>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="sf-form">
    <label class="sf-field sf-field-title">
      <span>Titre</span>
      <input type="text" formControlName="title" placeholder="Petit dejeuner" />
    </label>

    <div class="sf-macros">
      <div class="flex items-center justify-between gap-3">
        <h3 class="text-base font-semibold text-slate-900">Nutrition values</h3>
        <button type="button" class="menu-btn" (click)="addNutritionValue()">+</button>
      </div>

      <p *ngIf="nutritionKeys.length === 0" class="text-xs text-slate-600">
        Meta non chargee, saisie libre.
      </p>

      <div *ngFor="let value of nutritionValues; let i = index" class="grid gap-2 md:grid-cols-5">
        <input
          type="text"
          placeholder="Nutrition key"
          [(ngModel)]="value.nutritionKey"
          [ngModelOptions]="{ standalone: true }"
          (change)="onNutritionKeyChange(i)" />

        <input
          type="number"
          min="0"
          placeholder="Amount"
          [(ngModel)]="value.amount"
          [ngModelOptions]="{ standalone: true }" />

        <select
          [(ngModel)]="value.unit"
          [ngModelOptions]="{ standalone: true }">
          <option *ngFor="let unit of getUnitsForKey(value.nutritionKey)" [value]="unit">
            {{ unit }}
          </option>
        </select>

        <select
          [(ngModel)]="value.reference"
          [ngModelOptions]="{ standalone: true }">
          <option *ngFor="let reference of referenceOptions" [value]="reference.value">
            {{ reference.label }}
          </option>
        </select>

        <button type="button" class="menu-btn" (click)="removeNutritionValue(i)">x</button>
      </div>
    </div>

    <button type="submit" class="submit-btn">
      Valider
    </button>
  </form>
</section>
