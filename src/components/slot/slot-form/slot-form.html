<section class="slot-form" aria-label="Ajouter ou modifier un slot">
  <div class="sf-head">
    <h2>{{ heading }}</h2>
    <button type="button" class="menu-btn" aria-label="Plus d'options" (click)="onMenuClick()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6" cy="12" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="18" cy="12" r="2" />
      </svg>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="sf-form">
    <label class="sf-field sf-field-title">
      <span>Titre</span>
      <input type="text" formControlName="title" placeholder="Petit dejeuner" />
    </label>

    <div class="sf-macros">
      <label class="sf-field">
        <span>Prot</span>
        <input type="number" min="0" formControlName="protein" placeholder="0" />
      </label>

      <label class="sf-field">
        <span>Glu</span>
        <input type="number" min="0" formControlName="carbs" placeholder="0" />
      </label>

      <label class="sf-field">
        <span>Lip</span>
        <input type="number" min="0" formControlName="fat" placeholder="0" />
      </label>
    </div>

    <button type="submit" class="submit-btn">
      Valider
    </button>
  </form>
</section>
