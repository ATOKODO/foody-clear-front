<section
  aria-label="Liste des categories"
  data-testid="category-list"
  class="w-full"
  [ngClass]="compact ? '' : 'mx-auto max-w-6xl px-4 py-6'">
  <mat-card class="overflow-hidden rounded-2xl" [class.shadow-none]="compact">
    <div class="flex items-center justify-between gap-3 border-b border-slate-200 bg-slate-50 px-4 py-3 sm:px-6">
      <h2 class="text-base font-semibold text-slate-900">Categories</h2>

      <button
        *ngIf="isManageMode"
        mat-raised-button
        color="primary"
        type="button"
        data-testid="category-add"
        class="add-btn"
        (click)="onAddClick()">
        Ajouter
      </button>
    </div>

    <div class="p-3 sm:p-4" *ngIf="hasItems; else emptyState">
      <div class="overflow-x-auto rounded-xl border border-slate-200">
        <table mat-table [dataSource]="resolvedCategories" class="category-table w-full">
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef class="w-14" aria-label="Selection"></th>
            <td mat-cell *matCellDef="let item" class="w-14" (click)="$event.stopPropagation()">
              <mat-checkbox
                [checked]="isSelected(item.id)"
                [attr.aria-label]="'Selectionner ' + item.name"
                (click)="onCheckboxClick($event, item)">
              </mat-checkbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Categorie</th>
            <td mat-cell *matCellDef="let item">{{ item.name }}</td>
          </ng-container>

          <ng-container matColumnDef="warnBeforeDays">
            <th mat-header-cell *matHeaderCellDef>Alerte</th>
            <td mat-cell *matCellDef="let item">{{ getNumberDisplay(item.warnBeforeDays) }}</td>
          </ng-container>

          <ng-container matColumnDef="recentlyExpiredDays">
            <th mat-header-cell *matHeaderCellDef>Recent</th>
            <td mat-cell *matCellDef="let item">
              {{ getNumberDisplay(item.recentlyExpiredDays) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="minQuantity">
            <th mat-header-cell *matHeaderCellDef>Min qty</th>
            <td mat-cell *matCellDef="let item">{{ getNumberDisplay(item.minQuantity) }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let item" (click)="$event.stopPropagation()">
              <div class="flex flex-wrap gap-2">
                <button mat-stroked-button type="button" [attr.data-testid]="'category-edit-' + item.id" (click)="onEditClick(item)">
                  Modifier
                </button>
                <button mat-stroked-button color="warn" type="button" [attr.data-testid]="'category-delete-' + item.id" (click)="onDeleteClick(item)">
                  Retirer
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let item; let i = index; columns: displayedColumns"
            [attr.data-testid]="'category-row-' + item.id"
            [class.cl-active]="isRowActive(item, i)"
            [class.cl-selectable]="isSingleSelectMode || isMultiSelectMode"
            [attr.tabindex]="isSingleSelectMode ? 0 : null"
            [attr.role]="isSingleSelectMode ? 'button' : null"
            (click)="onRowClick(item)"
            (keydown)="onRowKeydown($event, item)">
          </tr>
        </table>
      </div>
    </div>
  </mat-card>

  <ng-template #emptyState>
    <mat-card appearance="outlined" class="rounded-xl">
      <mat-card-content class="p-4 text-sm text-slate-600">
        Aucune categorie disponible.
      </mat-card-content>
    </mat-card>
  </ng-template>
</section>
