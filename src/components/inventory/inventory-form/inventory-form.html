<section class="mx-auto max-w-5xl px-4 py-8 text-gray-900" aria-label="Ajouter ou modifier un inventory">
  <div class="mb-6 flex items-center justify-between border-b border-slate-200 pb-3">
    <h2 class="text-xl font-medium">{{ heading }}</h2>
    <button mat-stroked-button type="button" (click)="onMenuClick()">Options</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="grid gap-4 md:grid-cols-12">
      <mat-form-field appearance="fill" class="md:col-span-8">
        <mat-label>Nom *</mat-label>
        <input matInput type="text" formControlName="name" placeholder="Stock principal" />
      </mat-form-field>

      <div class="flex items-end md:col-span-4">
        <button mat-raised-button color="primary" type="submit" class="w-full">
          {{ mode === 'edit' ? 'Mettre a jour' : 'Creer' }}
        </button>
      </div>
    </div>
  </form>

</section>
