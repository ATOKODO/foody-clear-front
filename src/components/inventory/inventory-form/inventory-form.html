<section class="mx-auto max-w-5xl px-4 py-8 text-app-text-strong" [attr.aria-label]="&quot;Add or edit an inventory&quot; | translate">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-app-border pb-3">
    <h2 class="text-xl font-medium">{{ (heading) | translate }}</h2>
    <div class="inventory-form__header-actions flex flex-wrap items-center gap-2">
      <ng-content select="[inventory-form-header-actions]"></ng-content>
      <button mat-stroked-button type="button" (click)="onMenuClick()">{{ "Options" | translate }}</button>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="flex flex-col items-center">
      <div class="">
        <mat-form-field appearance="fill" class="w-full">
          <mat-label>{{ "Name *" | translate }}</mat-label>
          <input matInput type="text" formControlName="name" [placeholder]="&quot;Stock principal&quot; | translate" />
        </mat-form-field>
        <div class="inventory-form__under-name">
          <ng-content select="[inventory-form-under-name]"></ng-content>
        </div>
      </div>

      <div class="mt-6 w-50 flex items-start md:col-span-4 md:items-end">
        <button mat-raised-button color="primary" type="submit" class="w-full" [disabled]="saving()">
          {{ mode() === 'edit' ? ("Update" | translate) : ("Create" | translate) }}
        </button>
      </div>
    </div>
  </form>

</section>
