<ng-template #tableContent>
  <div class="inventory-list__table-wrap overflow-x-auto rounded-xl border border-app-border">
    <table mat-table [dataSource]="resolvedInventories" class="inventory-table w-full">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="w-14" aria-label="Selection"></th>
        <td mat-cell *matCellDef="let item" class="w-14">
          <mat-checkbox [checked]="isSelected(item.id)"
            [aria-label]="'Select ' + item.name"
            (change)="onCheckboxChange(item, $event.checked)"
            (click)="onCheckboxClick($event)"
            (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()" />
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Inventory</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="productCount">
        <th mat-header-cell *matHeaderCellDef>Products</th>
        <td mat-cell *matCellDef="let item">{{ item.productCount }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let item">
          <div class="inventory-list__actions">
            <button
              mat-stroked-button
              type="button"
              class="inventory-list__action inventory-list__action--edit"
              [attr.data-testid]="'inventory-edit-' + item.id"
              (click)="$event.stopPropagation(); onEditClick(item)">
              Edit
            </button>
            <button
              mat-stroked-button
              type="button"
              class="inventory-list__action inventory-list__action--delete"
              [attr.data-testid]="'inventory-delete-' + item.id"
              (click)="$event.stopPropagation(); onDeleteClick(item)">
              Remove
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let item; let i = index; columns: displayedColumns"
        [attr.data-testid]="'inventory-row-' + item.id"
        [class.il-active]="isRowActive(item, i)"
        [class.il-selectable]="isSingleSelectMode || isMultiSelectMode"
        [attr.tabindex]="isSingleSelectMode ? 0 : null"
        [attr.role]="isSingleSelectMode ? 'button' : null"
        (click)="onRowClick(item)"
        (keydown)="onRowKeydown($event, item)">
      </tr>
    </table>
  </div>
</ng-template>

@if (!embedded()) {
  <section
    class="mx-auto w-full max-w-6xl px-4 py-6"
    aria-label="Liste des inventories"
    data-testid="inventory-list">
    <mat-card class="overflow-hidden rounded-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-app-border bg-app-surface-soft px-4 py-3 sm:px-6">
        <h2 class="text-base font-semibold text-app-text-strong">Inventories</h2>
        @if (isManageMode) {
          <button
            mat-raised-button
            color="primary"
            type="button"
            data-testid="inventory-add"
            class="add-btn"
            (click)="onAddClick()">
            Add
          </button>
        }
      </div>
      @if (hasItems) {
        <div class="p-3 sm:p-4">
          <ng-container [ngTemplateOutlet]="tableContent" />
        </div>
      } @else {
        <mat-card appearance="outlined" class="rounded-xl">
          <mat-card-content class="p-4 text-sm text-app-text">
            No inventory available.
          </mat-card-content>
        </mat-card>
      }
    </mat-card>
  </section>
} @else {
  <div class="inventory-list inventory-list--embedded" data-testid="inventory-list-embedded">
    @if (hasItems) {
      <ng-container [ngTemplateOutlet]="tableContent" />
    } @else {
      <p class="inventory-list__empty text-sm text-app-text">No inventory available.</p>
    }
  </div>
}
