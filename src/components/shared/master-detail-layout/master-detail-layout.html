<div
  class="master-detail-layout"
  [style.--master-detail-side-width]="sideWidth()">
  <section
    class="master-detail-layout__side"
    [attr.aria-label]="(sideAriaLabel()) | translate">
    <div class="master-detail-layout__side-header">
      <div>
        <h3>{{ (sideTitle()) | translate }}</h3>
        @if (sideSubtitle(); as subtitle) {
          <p>{{ (subtitle) | translate }}</p>
        }
      </div>
      <ng-content select="[side-actions]" />
    </div>

    <ng-content select="[side-content]" />
  </section>

  <section
    class="master-detail-layout__detail"
    [attr.aria-label]="(detailAriaLabel()) | translate">
    <ng-content select="[detail-content]" />
  </section>
</div>
