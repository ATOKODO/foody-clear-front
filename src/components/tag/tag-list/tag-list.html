<ng-template #tableContent>
  <div class="overflow-x-auto rounded-xl border border-slate-200">
    <table mat-table [dataSource]="resolvedTags" class="tag-table w-full">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="w-14" aria-label="Selection"></th>
        <td mat-cell *matCellDef="let item" class="w-14" (click)="$event.stopPropagation()">
          <mat-checkbox [checked]="isSelected(item.id)"
            [attr.aria-label]="'Selectionner ' + item.name"
            (click)="onCheckboxClick($event, item)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Tag</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let item" (click)="$event.stopPropagation()">
          <div class="flex flex-wrap gap-2">
            <button mat-stroked-button type="button" [attr.data-testid]="'tag-edit-' + item.id" (click)="onEditClick(item)">
              Modifier
            </button>
            <button mat-stroked-button color="warn" type="button" [attr.data-testid]="'tag-delete-' + item.id" (click)="onDeleteClick(item)">
              Retirer
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let item; let i = index; columns: displayedColumns"
        [attr.data-testid]="'tag-row-' + item.id"
        [class.tl-active]="isRowActive(item, i)"
        [class.tl-selectable]="isSingleSelectMode || isMultiSelectMode"
        [attr.tabindex]="isSingleSelectMode ? 0 : null"
        [attr.role]="isSingleSelectMode ? 'button' : null"
        (click)="onRowClick(item)"
        (keydown)="onRowKeydown($event, item)">
      </tr>
    </table>
  </div>
</ng-template>

@if (!embedded()) {
  <section
    aria-label="Liste des tags"
    data-testid="tag-list"
    class="w-full"
    [class]="compact() ? '' : 'mx-auto max-w-6xl px-4 py-6'">
    <mat-card class="overflow-hidden rounded-2xl" [class.shadow-none]="compact()">
      <div class="flex items-center justify-between gap-3 border-b border-slate-200 bg-slate-50 px-4 py-3 sm:px-6">
        <h2 class="text-base font-semibold text-slate-900">Tags</h2>
        @if (isManageMode) {
          <button
            mat-raised-button
            color="primary"
            type="button"
            data-testid="tag-add"
            class="add-btn"
            (click)="onAddClick()">
            Ajouter
          </button>
        }
      </div>
      @if (hasItems) {
        <div class="p-3 sm:p-4">
          <ng-container [ngTemplateOutlet]="tableContent" />
        </div>
      } @else {
        <mat-card appearance="outlined" class="rounded-xl">
          <mat-card-content class="p-4 text-sm text-slate-600">
            Aucun tag disponible.
          </mat-card-content>
        </mat-card>
      }
    </mat-card>
  </section>
} @else {
  <div class="tag-list tag-list--embedded" data-testid="tag-list-embedded">
    @if (hasItems) {
      <ng-container [ngTemplateOutlet]="tableContent" />
    } @else {
      <p class="tag-list__empty text-sm text-slate-600">Aucun tag disponible.</p>
    }
  </div>
}
