<ng-template #tableContent>
  <div class="overflow-x-auto rounded-xl border border-app-border">
    <table mat-table [dataSource]="resolvedTags" class="tag-table w-full">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="w-14" [attr.aria-label]="&quot;Selection&quot; | translate"></th>
        <td mat-cell *matCellDef="let item" class="w-14">
          <mat-checkbox [checked]="isSelected(item.id)"
            [aria-label]="(&quot;&quot; + (&quot;Select&quot; | translate) + &quot; &quot;) + item.name"
            (change)="onCheckboxChange(item, $event.checked)"
            (click)="onCheckboxClick($event)"
            (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()" />
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ "Tag" | translate }}</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>{{ "Actions" | translate }}</th>
        <td
          mat-cell
          *matCellDef="let item"
          class="tag-table__actions-cell"
          >
          <div class="tag-table__actions">
            <button appButton variant="edit"
              type="button"
              class="tag-table__action tag-table__action--edit"
              [attr.data-testid]="'tag-edit-' + item.id"
              (click)="$event.stopPropagation(); onEditClick(item)">
              {{ "Edit" | translate }}
            </button>
            <button appButton variant="danger"
              type="button"
              class="tag-table__action tag-table__action--delete"
              [attr.data-testid]="'tag-delete-' + item.id"
              (click)="$event.stopPropagation(); onDeleteClick(item)">
              {{ "Remove" | translate }}
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let item; let i = index; columns: displayedColumns"
        [attr.data-testid]="'tag-row-' + item.id"
        [class.tl-active]="isRowActive(item, i)"
        [class.tl-selectable]="isSingleSelectMode || isMultiSelectMode"
        [attr.tabindex]="isSingleSelectMode ? 0 : null"
        [attr.role]="isSingleSelectMode ? 'button' : null"
        (click)="onRowClick(item)"
        (keydown)="onRowKeydown($event, item)">
      </tr>
    </table>
  </div>
</ng-template>

@if (!embedded()) {
  <section
    [attr.aria-label]="&quot;Liste des tags&quot; | translate"
    data-testid="tag-list"
    class="w-full"
    [class]="compact() ? '' : 'mx-auto max-w-6xl px-4 py-6'">
    <mat-card class="overflow-hidden rounded-2xl" [class.shadow-none]="compact()">
      <div class="flex items-center justify-between gap-3 border-b border-app-border bg-app-surface-soft px-4 py-3 sm:px-6">
        <h2 class="text-base font-semibold text-app-text-strong">{{ "Tags" | translate }}</h2>
        @if (isManageMode) {
          <button appButton variant="raised"
            type="button"
            data-testid="tag-add"
            class="add-btn"
            (click)="onAddClick()">
            {{ "Add" | translate }}
          </button>
        }
      </div>
      @if (hasItems) {
        <div class="p-3 sm:p-4">
          <ng-container [ngTemplateOutlet]="tableContent" />
        </div>
      } @else {
        <mat-card appearance="outlined" class="rounded-xl">
          <mat-card-content class="p-4"><p appEmptyState>
            {{ "No tag available." | translate }}
          </p></mat-card-content>
        </mat-card>
      }
    </mat-card>
  </section>
} @else {
  <div class="tag-list tag-list--embedded" data-testid="tag-list-embedded">
    @if (hasItems) {
      <ng-container [ngTemplateOutlet]="tableContent" />
    } @else {
      <p appEmptyState appearance="text" class="tag-list__empty">{{ "No tag available." | translate }}</p>
    }
  </div>
}
