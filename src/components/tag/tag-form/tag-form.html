<section class="mx-auto max-w-5xl px-4 py-8 text-gray-900" aria-label="Ajouter ou modifier un tag">
  <div *ngIf="showHeading" class="mb-6 flex items-center justify-between border-b border-slate-200 pb-3">
    <h2 class="text-xl font-medium">{{ heading }}</h2>
    <button mat-stroked-button type="button" (click)="onMenuClick()">Options</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="grid gap-4 md:grid-cols-12">
      <mat-form-field appearance="fill" class="md:col-span-12">
        <mat-label>Nom *</mat-label>
        <input matInput type="text" formControlName="name" placeholder="Bio" />
        <mat-error *ngIf="form.controls.name.hasError('required')">
          Le nom est requis.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="flex justify-center pt-2">
      <button mat-raised-button color="primary" type="submit" class="rounded-full px-8">
        {{ mode === 'edit' ? 'Mettre a jour' : 'Creer' }}
      </button>
    </div>
  </form>
</section>
