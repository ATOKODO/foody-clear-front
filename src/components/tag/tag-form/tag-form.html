<section class="mx-auto max-w-5xl px-4 py-8 text-app-text-strong" [attr.aria-label]="&quot;Add or edit a tag&quot; | translate">
  @if (showHeading()) {
    <div class="mb-6 flex items-center justify-between border-b border-app-border pb-3">
      <h2 class="text-xl font-medium">{{ (heading) | translate }}</h2>
      <button appButton variant="secondary" type="button" (click)="onMenuClick()">{{ "Options" | translate }}</button>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="grid gap-4 md:grid-cols-12">
      <mat-form-field appearance="fill" class="md:col-span-12">
        <mat-label>{{ "Name *" | translate }}</mat-label>
        <input matInput type="text" formControlName="name" [placeholder]="&quot;Bio&quot; | translate" />
        @if (form.controls.name.hasError('required')) {
          <mat-error>
            {{ "Name is required." | translate }}
          </mat-error>
        }
      </mat-form-field>
    </div>

    <div class="flex justify-center pt-2">
      <button appButton variant="primary" type="submit" [disabled]="saving()" class="rounded-full px-8">
        {{ mode() === 'edit' ? ("Update" | translate) : ("Create" | translate) }}
      </button>
    </div>
  </form>
</section>
