<section class="list-cycle" aria-label="Liste des cycles">
  <div class="lc-header" aria-hidden="true">
    <div class="lc-date-head">Duree</div>
    <div class="lc-values-head">
      <span>Cycle</span>
      <span>Proteine</span>
      <span>Glucide</span>
      <span>Lipide</span>
    </div>
    <div></div>
  </div>

  <div class="lc-body" *ngIf="cycles.length > 0; else emptyState">
    <div class="lc-row" *ngFor="let cycle of cycles; let i = index" [class.is-active]="isActive(cycle, i)">
      <div class="lc-date">
        <span class="lc-mobile-label">Duree</span>
        <span>{{ cycle.durationCount }} {{ cycle.durationType }}</span>
      </div>

      <div class="lc-values">
        <div class="lc-cell lc-cycle-name">
          <span class="lc-mobile-label">Cycle</span>
          <span>{{ cycle.title }}</span>
        </div>

        <div class="lc-cell">
          <span class="lc-mobile-label">Proteine</span>
          <span>{{ cycle.proteins }}</span>
        </div>

        <div class="lc-cell">
          <span class="lc-mobile-label">Glucide</span>
          <span>{{ cycle.carbs }}</span>
        </div>

        <div class="lc-cell">
          <span class="lc-mobile-label">Lipide</span>
          <span>{{ cycle.lipids }}</span>
        </div>
      </div>

      <div class="lc-actions">
        <button type="button" class="icon-btn" aria-label="Modifier le cycle" (click)="onEdit(cycle)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm17.71-10.04a1.004 1.004 0 0 0 0-1.42l-2.5-2.5a1.004 1.004 0 0 0-1.42 0L14.95 5.13l3.75 3.75 2.01-1.67Z" />
          </svg>
        </button>

        <button type="button" class="icon-btn" aria-label="Supprimer le cycle" (click)="onDelete(cycle)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm1 6h2v9h-2V9Zm4 0h2v9h-2V9ZM6 9h2v9H6V9Zm1 12h10a2 2 0 0 0 2-2V8H5v11a2 2 0 0 0 2 2Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <p class="lc-empty">Aucun cycle disponible.</p>
  </ng-template>

  <div class="lc-add-wrap" *ngIf="showAddButton">
    <button type="button" class="icon-btn add-btn" aria-label="Ajouter un cycle" (click)="onAddCycle()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5h2v14h-2z" />
        <path d="M5 11h14v2H5z" />
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Z" />
      </svg>
    </button>
  </div>
</section>
