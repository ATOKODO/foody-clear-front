<section
  class="dsl-shell"
  [class.dsl-shell--embedded]="embedded"
  aria-label="Liste des day sets"
  data-testid="day-set-list">
  <ng-container *ngIf="embedded; else standaloneShell">
    <ng-container *ngIf="hasItems; else embeddedEmptyState">
      <ng-container [ngTemplateOutlet]="tableContent"></ng-container>
    </ng-container>
  </ng-container>

  <ng-template #standaloneShell>
    <mat-card class="overflow-hidden rounded-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-slate-200 bg-slate-50 px-4 py-3 sm:px-6">
        <h2 class="text-base font-semibold text-slate-900">Day Sets</h2>

        <button
          *ngIf="isManageMode"
          mat-raised-button
          color="primary"
          type="button"
          data-testid="day-set-add"
          class="add-btn"
          (click)="onAddClick()">
          Ajouter
        </button>
      </div>

      <div class="p-3 sm:p-4" *ngIf="hasItems; else emptyState">
        <ng-container [ngTemplateOutlet]="tableContent"></ng-container>
      </div>
    </mat-card>
  </ng-template>

  <ng-template #tableContent>
    <div class="dsl-table-shell overflow-x-auto rounded-xl border border-slate-200">
      <table mat-table [dataSource]="resolvedDaySets" class="day-set-table w-full">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="w-14" aria-label="Selection"></th>
          <td mat-cell *matCellDef="let item" class="w-14" (click)="$event.stopPropagation()">
            <mat-checkbox
              [checked]="isSelected(item.id)"
              [disabled]="isSelectionDisabled(item)"
              [attr.aria-label]="'Selectionner ' + item.title"
              (click)="onCheckboxClick($event, item)">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>DaySet</th>
          <td mat-cell *matCellDef="let item">
            <div class="leading-tight">
              <p>{{ item.title }}</p>
              <p *ngIf="item.templateTitle" class="text-xs text-slate-500">
                Template: {{ item.templateTitle }}
              </p>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="protein">
          <th mat-header-cell *matHeaderCellDef>Proteine</th>
          <td mat-cell *matCellDef="let item">{{ getProtein(item) }}</td>
        </ng-container>

        <ng-container matColumnDef="carbs">
          <th mat-header-cell *matHeaderCellDef>Glucide</th>
          <td mat-cell *matCellDef="let item">{{ getCarbs(item) }}</td>
        </ng-container>

        <ng-container matColumnDef="fat">
          <th mat-header-cell *matHeaderCellDef>Lipide</th>
          <td mat-cell *matCellDef="let item">{{ getFat(item) }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item" (click)="$event.stopPropagation()">
            <div class="flex flex-wrap gap-2">
              <button mat-stroked-button type="button" [attr.data-testid]="'day-set-edit-' + item.id" (click)="onEditClick(item)">
                Modifier
              </button>
              <button mat-stroked-button color="warn" type="button" [attr.data-testid]="'day-set-delete-' + item.id" (click)="onDeleteClick(item)">
                Retirer
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let item; let i = index; columns: displayedColumns"
          [attr.data-testid]="'day-set-row-' + item.id"
          [class.dsl-active]="isRowActive(item, i)"
          [class.dsl-disabled]="isSelectionDisabled(item)"
          [class.dsl-selectable]="isSingleSelectMode || isMultiSelectMode"
          [attr.tabindex]="isSingleSelectMode ? 0 : null"
          [attr.role]="isSingleSelectMode ? 'button' : null"
          (click)="onRowClick(item)"
          (keydown)="onRowKeydown($event, item)">
        </tr>
      </table>
    </div>
  </ng-template>

  <ng-template #emptyState>
    <mat-card appearance="outlined" class="rounded-xl">
      <mat-card-content class="p-4 text-sm text-slate-600">
        Aucun day set disponible.
      </mat-card-content>
    </mat-card>
  </ng-template>

  <ng-template #embeddedEmptyState>
    <p class="dsl-empty text-sm text-slate-600">Aucun day set disponible.</p>
  </ng-template>
</section>
