<section class="mx-auto max-w-4xl px-4 py-8 text-gray-900" aria-label="Ajouter ou modifier un day set">
  <div class="mb-6 flex items-center justify-between border-b border-slate-200 pb-3">
    <h2 class="text-xl font-medium">{{ heading }}</h2>
    <button mat-stroked-button type="button" (click)="onMenuClick()">Options</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <mat-form-field appearance="fill" class="dsf-field w-full">
      <mat-label>Titre</mat-label>
      <input matInput type="text" formControlName="title" placeholder="Lundi" />
    </mat-form-field>

    <div class="grid gap-4 md:grid-cols-3">
      <mat-form-field appearance="fill" class="dsf-field w-full">
        <mat-label>Proteine</mat-label>
        <input matInput type="number" min="0" formControlName="protein" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="dsf-field w-full">
        <mat-label>Glucide</mat-label>
        <input matInput type="number" min="0" formControlName="carbs" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="dsf-field w-full">
        <mat-label>Lipide</mat-label>
        <input matInput type="number" min="0" formControlName="fat" />
      </mat-form-field>
    </div>

    <div class="flex justify-center pt-2">
      <button mat-raised-button color="primary" type="submit" class="rounded-full px-8">
        Valider
      </button>
    </div>
  </form>
</section>
