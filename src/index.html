<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoodyClearFront</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="">
  <app-root></app-root>
  <script>
    (() => {
      const hash = globalThis.location.hash.startsWith('#') ? globalThis.location.hash.slice(1) : '';
      const hashParams = new URLSearchParams(hash);
      const searchParams = new URLSearchParams(globalThis.location.search);
      const readParam = (key) => hashParams.get(key) || searchParams.get(key) || '';
      const captureId = readParam('figmacapture');
      const requestedView = readParam('figmaview').trim();
      const requestedCycleModal = readParam('figmacyclemodal').trim();
      const requestedTheme = readParam('figmatheme').trim().toLowerCase();
      const requestedTemplateModal = readParam('figmatemplatemodal').trim().toLowerCase();
      const requestedTemplateId = readParam('figmatemplateid').trim();
      const shouldExpandCycleDialog = ['1', 'true', 'cycle-add'].includes(
        readParam('figmafulldialog').trim().toLowerCase(),
      );
      const shouldExpandTemplateDialog = ['1', 'true', 'template-add', 'template-edit'].includes(
        readParam('figmafulldialog').trim().toLowerCase(),
      );

      if (captureId) {
        const captureScript = document.createElement('script');
        captureScript.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
        captureScript.async = true;
        document.head.appendChild(captureScript);
      }

      const watchForElement = (selector, onFound, maxAttempts = 120, delayMs = 250) => {
        let attempts = 0;
        const run = () => {
          const target = document.querySelector(selector);
          if (!(target instanceof HTMLElement)) {
            return false;
          }

          onFound(target);
          return true;
        };

        if (run()) {
          return;
        }

        const intervalId = globalThis.setInterval(() => {
          attempts += 1;
          if (run() || attempts >= maxAttempts) {
            globalThis.clearInterval(intervalId);
          }
        }, delayMs);
      };

      const applyRequestedTheme = () => {
        if (!['light', 'dark'].includes(requestedTheme)) {
          return;
        }

        const root = document.documentElement;
        const wantsDark = requestedTheme === 'dark';

        try {
          globalThis.localStorage.setItem('theme', requestedTheme);
        } catch {
          // Ignore storage access errors during capture.
        }

        root.classList.toggle('dark', wantsDark);
        root.style.colorScheme = requestedTheme;

        watchForElement('.app-theme-toggle', (toggle) => {
          const isDarkMode = toggle.getAttribute('aria-pressed') === 'true';
          if (isDarkMode !== wantsDark) {
            toggle.click();
          }
        });
      };

      applyRequestedTheme();

      if (requestedView && ['year', 'month', 'week', 'day'].includes(requestedView)) {
        watchForElement(`[data-testid="planning-view-${requestedView}"]`, (target) => {
          target.click();
        });
      }

      const applyCycleDialogCaptureStyles = () => {
        if (document.getElementById('figma-cycle-dialog-capture-styles')) {
          return;
        }

        const style = document.createElement('style');
        style.id = 'figma-cycle-dialog-capture-styles';
        style.textContent = `
          html, body {
            height: auto !important;
            overflow: visible !important;
          }

          body.cdk-global-scrollblock {
            position: static !important;
            inset: auto !important;
            overflow: visible !important;
            width: auto !important;
          }

          .cdk-overlay-container,
          .cdk-global-overlay-wrapper {
            position: absolute !important;
            inset: 0 !important;
            height: auto !important;
          }

          .cdk-global-overlay-wrapper {
            align-items: flex-start !important;
            justify-content: center !important;
            overflow: visible !important;
            padding: 24px 0 !important;
          }

          .cdk-overlay-pane,
          .mat-mdc-dialog-container,
          .mat-mdc-dialog-inner-container,
          .mat-mdc-dialog-surface,
          .mdc-dialog__surface,
          .cycle-form-dialog,
          .cycle-form-dialog__content,
          .mat-mdc-dialog-content {
            max-height: none !important;
            height: auto !important;
            overflow: visible !important;
          }
        `;
        document.head.appendChild(style);
      };

      if (requestedCycleModal === 'add') {
        watchForElement('[data-testid="cycle-add"]', (button) => {
          button.click();
          watchForElement('[data-testid="cycle-dialog"]', () => {
            if (shouldExpandCycleDialog) {
              applyCycleDialogCaptureStyles();
            }
          });
        });
      }

      const applyTemplateDialogCaptureStyles = () => {
        if (document.getElementById('figma-template-dialog-capture-styles')) {
          return;
        }

        const style = document.createElement('style');
        style.id = 'figma-template-dialog-capture-styles';
        style.textContent = `
          html, body {
            height: auto !important;
            overflow: visible !important;
          }

          body.cdk-global-scrollblock {
            position: static !important;
            inset: auto !important;
            overflow: visible !important;
            width: auto !important;
          }

          .cdk-overlay-container,
          .cdk-global-overlay-wrapper {
            position: absolute !important;
            inset: 0 !important;
            height: auto !important;
          }

          .cdk-global-overlay-wrapper {
            align-items: flex-start !important;
            justify-content: center !important;
            overflow: visible !important;
            padding: 24px 0 !important;
          }

          .cdk-overlay-pane,
          .mat-mdc-dialog-container,
          .mat-mdc-dialog-inner-container,
          .mat-mdc-dialog-surface,
          .mdc-dialog__surface,
          .template-form-dialog,
          .template-form-dialog__content,
          .mat-mdc-dialog-content {
            max-height: none !important;
            height: auto !important;
            overflow: visible !important;
          }
        `;
        document.head.appendChild(style);
      };

      const finalizeTemplateDialogCapture = () => {
        watchForElement('[data-testid="template-dialog"]', () => {
          if (shouldExpandTemplateDialog) {
            applyTemplateDialogCaptureStyles();
          }
        });
      };

      if (requestedTemplateModal === 'add') {
        watchForElement('[data-testid="template-add"]', (button) => {
          button.click();
          finalizeTemplateDialogCapture();
        });
      }

      if (requestedTemplateModal === 'edit') {
        const openTemplateEditDialog = (attempt = 0) => {
          const button = document.querySelector('[data-testid="template-edit"]');
          const dialog = document.querySelector('[data-testid="template-dialog"]');

          if (dialog instanceof HTMLElement) {
            finalizeTemplateDialogCapture();
            return;
          }

          if (!(button instanceof HTMLElement)) {
            if (attempt < 120) {
              globalThis.setTimeout(() => openTemplateEditDialog(attempt + 1), 250);
            }
            return;
          }

          button.click();

          globalThis.setTimeout(() => {
            const nextDialog = document.querySelector('[data-testid="template-dialog"]');
            if (nextDialog instanceof HTMLElement) {
              finalizeTemplateDialogCapture();
              return;
            }

            if (attempt < 120) {
              openTemplateEditDialog(attempt + 1);
            }
          }, 250);
        };

        if (requestedTemplateId) {
          watchForElement(`[data-testid="template-select-${requestedTemplateId}"]`, (button) => {
            button.click();
            globalThis.setTimeout(openTemplateEditDialog, 200);
          });
        } else {
          openTemplateEditDialog();
        }
      }
    })();
  </script>
</body>
</html>
