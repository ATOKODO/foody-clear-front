<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foody Clear</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245a42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Foody Clear">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="color-scheme" content="light dark">
  <script>
    (() => {
      let storedTheme = null;

      try {
        storedTheme = globalThis.localStorage.getItem('theme');
      } catch {
        // Storage can be unavailable in hardened or private browsing contexts.
      }

      const prefersDark = globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
      const useDarkTheme = storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark);

      document.documentElement.classList.toggle('dark', useDarkTheme);
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="">
  <app-root></app-root>
  <noscript>Activez JavaScript pour utiliser Foody Clear.</noscript>
</body>
</html>
